<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="KinPhone">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>KinPhone Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #F2F2F7; --fg: #000; --muted: #6C6C70; --sub: #8E8E93; --line: rgba(60,60,67,.18); --panel: #FFFFFF;
  --accent: #007AFF; --accent-ink: #FFFFFF; --switch: #34C759; --danger: #FF3B30; --warn: #FF9500; --ok: #34C759;
  --chip: rgba(118,118,128,.12); --fill: rgba(118,118,128,.12); --press: rgba(0,0,0,.05);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #000; --fg: #FFF; --muted: #98989F; --sub: #8E8E93; --line: rgba(84,84,88,.6); --panel: #1C1C1E;
    --accent: #0A84FF; --accent-ink: #FFF; --switch: #30D158; --danger: #FF453A; --warn: #FF9F0A; --ok: #30D158;
    --chip: rgba(118,118,128,.24); --fill: rgba(118,118,128,.24); --press: rgba(255,255,255,.06); color-scheme: dark; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif; font-size: 17px; -webkit-font-smoothing: antialiased; letter-spacing: -.01em; }
body { padding: env(safe-area-inset-top) max(16px, env(safe-area-inset-right)) calc(92px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
button, input, select { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; padding-top: 14px; }
h1 { font-size: 34px; font-weight: 700; letter-spacing: .01em; margin: 8px 0 0; line-height: 1.1; }
.sub { color: var(--muted); font-size: 15px; line-height: 1.4; margin: -14px 0 0; }

/* profile card at the top, like the Apple ID row */
.head { display: flex; align-items: center; gap: 14px; background: var(--panel); border-radius: 12px; padding: 12px 16px; }
.av { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 600; font-size: 25px; flex: none; background: #5D4037; }
.head .t { flex: 1; min-width: 0; }
.head b { display: block; font-size: 21px; font-weight: 600; }
.head small { color: var(--muted); font-size: 14px; display: flex; gap: 6px; align-items: center; margin-top: 2px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sub); }
.dot.on { background: var(--ok); }
.batt { font-weight: 500; font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* grouped list */
h3.sh { margin: 0 0 -15px 16px; font-size: 13px; font-weight: 400; text-transform: uppercase; letter-spacing: .02em; color: var(--muted); }
.card { background: var(--panel); border-radius: 12px; padding: 12px 16px; display: flex; flex-direction: column; gap: 11px; overflow: hidden; }
.card h3 { margin: 0; font-size: 13px; font-weight: 400; text-transform: uppercase; color: var(--muted); }
.card > .sep { margin-right: -16px; }
.sep { height: .5px; background: var(--line); margin: 0; }
.row { display: flex; align-items: center; gap: 12px; min-height: 30px; }
.row .t { flex: 1; min-width: 0; }
.row .t b { display: block; font-size: 17px; font-weight: 400; }
.row .t .badge { display: inline-block; }
.row .t span { display: block; font-size: 13px; color: var(--muted); line-height: 1.35; margin-top: 1px; }
.info { font-size: 13px; color: var(--muted); line-height: 1.4; }

/* iOS segmented control */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--fill); border-radius: 9px; padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; border-radius: 7px; padding: 7px 0; font-weight: 500; font-size: 14px; color: var(--fg); transition: background .2s; }
.seg button.on { background: var(--panel); font-weight: 600; box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.04); }
@media (prefers-color-scheme: dark) { .seg button.on { background: #636366; } }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 13px; font-weight: 500; padding: 4px 10px; border-radius: 999px; background: var(--chip); }
.status { font-size: 13px; display: flex; gap: 6px; align-items: center; color: var(--muted); }
.status.sending { color: var(--warn); }
.status.done { color: var(--ok); }
.status.err { color: var(--danger); }

/* iOS switch */
.sw { width: 51px; height: 31px; border-radius: 999px; border: 0; background: var(--fill); position: relative; flex: none; padding: 0; transition: background .25s; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; transition: transform .25s cubic-bezier(.3,.7,.4,1); box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 3px 1px rgba(0,0,0,.06); }
.sw.on { background: var(--switch); }
.sw.on::after { transform: translateX(20px); }

.appic { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; color: #fff; font-size: 15px; flex: none; font-weight: 600; }
.lock { font-size: 15px; color: var(--sub); }

/* buttons: primary is a filled pill, others read like iOS list rows */
.btn { border: 0; background: var(--panel); border-radius: 12px; padding: 13px 16px; font-weight: 400; font-size: 17px; text-align: center; color: var(--accent); }
.btn:active { background: var(--press); }
.card .btn { background: var(--fill); border-radius: 10px; padding: 11px 14px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); font-weight: 600; border-radius: 14px; }
.btn.danger { color: var(--danger); }
.btn[disabled] { opacity: .7; }

.rtime { font-size: 24px; font-weight: 300; font-variant-numeric: tabular-nums; min-width: 82px; }
.rtime small { font-size: 13px; font-weight: 400; margin-left: 2px; }
.rstate { font-size: 13px; font-weight: 500; display: block; margin-top: 2px; }
.rstate.done { color: var(--ok); } .rstate.missed { color: var(--danger); } .rstate.snoozed { color: var(--warn); }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.days button { border: 0; background: var(--fill); border-radius: 999px; aspect-ratio: 1; font-weight: 600; font-size: 13px; color: var(--fg); }
.days button.on { background: var(--accent); color: var(--accent-ink); }
.star { border: 0; background: transparent; font-size: 22px; color: var(--line); padding: 4px; line-height: 1; }
.star.on { color: #FFCC00; }
.badge { font-size: 11px; font-weight: 600; color: #fff; background: var(--danger); border-radius: 6px; padding: 1px 6px; margin-left: 6px; vertical-align: 2px; }
label.f { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 400; color: var(--muted); }
label.f input, label.f select { border: 0; background: var(--fill); border-radius: 10px; padding: 11px 12px; font-size: 17px; font-weight: 400; color: var(--fg); -webkit-appearance: none; appearance: none; min-height: 44px; }
label.f input:focus, label.f select:focus { outline: 2px solid var(--accent); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* frosted tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(249,249,249,.86); -webkit-backdrop-filter: saturate(1.8) blur(20px); backdrop-filter: saturate(1.8) blur(20px); border-top: .5px solid var(--line); display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 6px max(6px, env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom)); z-index: 5; }
@media (prefers-color-scheme: dark) { .tabs { background: rgba(22,22,24,.86); } }
.tabs button { border: 0; background: transparent; display: grid; justify-items: center; gap: 2px; font-size: 10.5px; font-weight: 500; color: var(--sub); padding: 4px 0; letter-spacing: 0; }
.tabs button svg { width: 26px; height: 26px; }
.tabs button.on { color: var(--accent); }
svg.i { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

.toast { position: fixed; left: 16px; right: 16px; top: calc(10px + env(safe-area-inset-top)); z-index: 10; background: rgba(30,30,32,.92); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); color: #fff; border-radius: 16px; padding: 13px 16px; font-weight: 500; font-size: 15px; max-width: 520px; margin: 0 auto; box-shadow: 0 10px 30px -10px rgba(0,0,0,.4); animation: drop .35s cubic-bezier(.2,.9,.3,1.2); }
@keyframes drop { from { transform: translateY(-20px); opacity: 0; } }
.code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 14px; background: var(--fill); border-radius: 10px; padding: 11px; word-break: break-all; }
ol { margin: 0; padding-left: 20px; line-height: 1.55; font-size: 16px; }

/* phone switcher */
.devs { display: flex; gap: 8px; overflow-x: auto; padding: 0 0 2px; scrollbar-width: none; margin-bottom: -10px; }
.devs::-webkit-scrollbar { display: none; }
.devs button { flex: none; display: flex; align-items: center; gap: 8px; border: 0; background: var(--panel); border-radius: 999px; padding: 5px 14px 5px 5px; font-weight: 500; font-size: 15px; }
.devs button.on { background: var(--accent); color: #fff; }
.devs .mini { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 600; position: relative; }
.devs .mini i { position: absolute; right: -1px; bottom: -1px; width: 9px; height: 9px; border-radius: 50%; background: var(--sub); border: 2px solid var(--panel); }
.devs button.on .mini i { border-color: var(--accent); }
.devs .mini i.on { background: var(--ok); }
.devs .add { color: var(--accent); padding: 5px 14px; }
.headwrap { position: relative; }
.head .more { flex: none; position: relative; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--fill); color: var(--accent); display: grid; place-items: center; margin-left: 2px; }
.head .more svg { width: 22px; height: 22px; fill: currentColor; }
.head .more[aria-expanded=true] { background: var(--accent); color: #fff; }
.head .more .pip { position: absolute; top: 4px; right: 4px; width: 10px; height: 10px; border-radius: 50%; background: #FF9500; border: 2px solid var(--panel); }
.phmenu { position: absolute; right: 8px; top: calc(100% + 6px); z-index: 30; width: min(330px, calc(100% - 16px)); background: var(--panel); border-radius: 14px; padding: 6px 14px 10px; box-shadow: 0 18px 50px -12px rgba(0,0,0,.35), 0 0 0 .5px var(--line); display: grid; gap: 8px; }
.phmenu .mh { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .02em; padding: 6px 0 0; }
/* My phones list (Phone tab) */
.prow { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: none; padding: 2px 0; text-align: left; font: inherit; color: inherit; }
.prow .t { flex: 1; min-width: 0; }
.prow .t b { display: block; font-size: 17px; font-weight: 400; }
.prow.on .t b { font-weight: 600; }
.prow .t span { display: block; font-size: 13px; color: var(--muted); margin-top: 1px; }
.pav { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 17px; font-weight: 600; position: relative; }
.pav i { position: absolute; right: 0; bottom: 0; width: 11px; height: 11px; border-radius: 50%; background: var(--sub); border: 2px solid var(--panel); }
.pav i.on { background: var(--ok); }
.pav.plus { background: var(--fill); color: var(--accent); font-size: 26px; font-weight: 300; }
.prow.add .t b { color: var(--accent); }
.prow .tick { color: var(--accent); font-size: 19px; font-weight: 600; }
.prow .chev { color: var(--sub); font-size: 24px; line-height: 1; }

.pick { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pick button { border: 2px solid transparent; background: var(--panel); border-radius: 14px; padding: 18px 12px; display: grid; gap: 6px; justify-items: center; text-align: center; }
.pick button.on { border-color: var(--accent); }
.pick b { font-size: 17px; font-weight: 600; } .pick span { font-size: 13px; color: var(--muted); line-height: 1.35; } .pick em { font-style: normal; font-size: 34px; }
.step { display: flex; align-items: center; gap: 0; flex: none; background: var(--fill); border-radius: 9px; }
.step button { width: 40px; height: 32px; border: 0; background: transparent; font-weight: 400; font-size: 20px; line-height: 1; color: var(--fg); }
.step b { min-width: 66px; text-align: center; font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; border-left: .5px solid var(--line); border-right: .5px solid var(--line); line-height: 20px; }
.bar { height: 5px; border-radius: 5px; background: var(--fill); overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--ok); border-radius: 5px; }
.bar i.over { background: var(--danger); }
.loc { display: flex; gap: 12px; align-items: center; }
.ask { background: #FFF6E0; }
.book { display: grid; gap: 8px; }
.book input[type=search] { width: 100%; font: inherit; font-size: 17px; padding: 10px 12px; border-radius: 10px; border: 0; background: var(--fill); color: var(--fg); }
.blist { max-height: 300px; overflow: auto; border-radius: 10px; }
.brow { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 10px 4px; font: inherit; color: var(--fg); }
.brow b { display: block; font-weight: 500; font-size: 16px; }
.brow span { display: block; font-size: 13px; color: var(--muted); }
.brow:disabled { opacity: .45; }
@media (prefers-color-scheme: dark) { .ask { background: #3A2E12; } body .ask .q .hg { background: #5C4714; } }
.ask .q { display: flex; gap: 12px; align-items: center; }
.ask .q .hg { width: 40px; height: 40px; flex: none; border-radius: 50%; background: #FFE7A8; display: grid; place-items: center; font-size: 20px; }
.ask .q b { display: block; font-size: 17px; font-weight: 600; }
.ask .q span { display: block; font-size: 13px; color: var(--muted); margin-top: 1px; }
.ask .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pin { width: 44px; height: 44px; border-radius: 12px; background: #FF3B30; display: grid; place-items: center; color: #fff; flex: none; }
.pin svg { width: 24px; height: 24px; }
.tchips { display: flex; flex-wrap: wrap; gap: 8px; }
.tchips span { display: inline-flex; align-items: center; gap: 6px; padding: 6px 6px 6px 12px; border-radius: 999px; background: var(--fill); font-weight: 500; font-size: 15px; }
.tchips button { border: 0; background: var(--sub); color: var(--panel); width: 20px; height: 20px; border-radius: 50%; font-size: 11px; line-height: 1; padding: 0; }
.spin { display: inline-block; width: 13px; height: 13px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: sp .8s linear infinite; vertical-align: -2px; }
@keyframes sp { to { transform: rotate(360deg); } }
a.lnk { color: var(--accent); font-weight: 400; text-decoration: none; font-size: 15px; }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: transparent; padding: 2px 0; text-align: left; color: var(--fg); }
.opt .t { flex: 1; min-width: 0; }
.opt .t b { display: block; font-size: 17px; font-weight: 400; }
.opt .t span { display: block; font-size: 13px; color: var(--muted); line-height: 1.35; margin-top: 1px; }
.opt .rad { width: 24px; height: 24px; flex: none; border-radius: 50%; border: 2px solid var(--sub); position: relative; transition: border-color .2s; }
.opt .rad::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--accent); transform: scale(0); transition: transform .2s cubic-bezier(.3,.8,.4,1.4); }
.opt.on .rad { border-color: var(--accent); }
.opt.on .rad::after { transform: scale(1); }
.opt:active { opacity: .6; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs" hidden></nav>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
  const NTFY = 'https://ntfy.sh/';
  const LS = 'simplephone.control.v1';
  const LS2 = 'simplephone.control.v2';
  const keys = new Map();
  const APPS = {
    contacts: ['Contacts', '#2E7D32', true], messages: ['Messages', '#1565C0', true], dial: ['Dial', '#2E7D32', true],
    whatsapp: ['WhatsApp', '#2E7D32'], camera: ['Camera', '#6A1B9A'], photos: ['Photos', '#AD4E00'],
    youtube: ['YouTube', '#B71C1C'], chrome: ['Internet', '#37474F']
  };
  const ORDER = Object.keys(APPS);
  const MODE_INFO = {
    basic: 'Photo Dial, Contacts, Messages and Dial, plus Camera and Photos if you switch them on. Everything else is locked away.',
    full: 'Calls and messages, plus only the apps you choose below.'
  };
  const MODE_INFO_KID = {
    basic: 'Photo Dial, calls and messages, plus Camera and Photos if you switch them on. A good first phone.',
    full: 'Calls and messages, plus only the apps you choose. Time limits and bedtime still apply.'
  };
  const isKid = (c = store.cfg) => c && c.profile === 'child';
  const modeInfo = m => (isKid() ? MODE_INFO_KID : MODE_INFO)[m];
  const LIMIT_STEPS = [0, 15, 30, 45, 60, 90, 120, 180];
  const WHY = { ask: 'You asked', sched: 'Scheduled', checkin: 'Check-in', sos: 'SOS' };
  const ICON = {
    gauge: '<path d="M4 18a8 8 0 1 1 16 0"/><path d="M12 18l4-6"/>',
    apps: '<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
    bell: '<path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/>',
    pin: '<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
    gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>'
  };
  const ic = n => `<svg class="i" viewBox="0 0 24 24">${ICON[n]}</svg>`;
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const cap = s => s[0].toUpperCase() + s.slice(1);

  function defaults(profile) {
    const kid = profile === 'child';
    return {
      v: 1, ts: 0, mode: kid ? 'basic' : 'full', profile: kid ? 'child' : 'senior',
      limits: kid ? { youtube: 45, chrome: 30 } : {}, loc: { times: [] }, checkin: ['Reached school', "I'm home"],
      modes: {
        basic: ['contacts', 'messages', 'dial'],
        full: ['contacts', 'messages', 'dial', 'whatsapp', 'camera', 'photos']
      },
      set: { unknownDial: !kid, blockUnknown: kid, smsLinks: false, sos: true, xl: false, lock: true, popups: !kid },
      night: { on: kid, from: kid ? '21:00' : '22:00', to: '07:00' },
      pin: '1234', name: kid ? 'Child' : 'Dad', guardian: 'Ravi',
      contacts: [], rem: []
    };
  }
  /** Fill in fields added after a config was first made. */
  function ensure(c) {
    if (!c) return c;
    c.rem = c.rem || []; c.profile = c.profile || 'senior'; c.limits = c.limits || {};
    // Two modes now: an old "Normal" phone becomes Full with the same apps.
    if (c.modes && c.modes.normal) { if (c.mode === 'normal') { c.mode = 'full'; c.modes.full = c.modes.normal; } delete c.modes.normal; }
    if (c.mode === 'normal') c.mode = 'full';
    c.loc = c.loc || { times: [] }; c.loc.times = c.loc.times || [];
    c.checkin = Array.isArray(c.checkin) && c.checkin.length ? c.checkin : ['Reached school', "I'm home"];
    return c;
  }

  /* Several phones: book = { devices: [{ id, pair, cfg, seenAdd, seenCk }], cur } */
  let book = loadBook();
  let store = book.devices.find(d => d.id === book.cur) || book.devices[0] || { id: null, pair: null, cfg: null };
  const statuses = {};
  let tab = 'home', appsMode = null, editing = null, sendState = 'idle', status = null, adding = false, setupPick = 'senior', setupTouched = false;

  function loadBook() {
    try { const b = JSON.parse(localStorage.getItem(LS2)); if (b && Array.isArray(b.devices)) { b.devices.forEach(d => ensure(d.cfg)); return b; } } catch (e) {}
    try {
      const s = JSON.parse(localStorage.getItem(LS));
      if (s && s.pair) { const id = 'd' + Date.now().toString(36); return { devices: [{ id, pair: s.pair, cfg: ensure(s.cfg || defaults()), seenAdd: s.seenAdd || 0 }], cur: id }; }
    } catch (e) {}
    return { devices: [], cur: null };
  }
  function save() { try { localStorage.setItem(LS2, JSON.stringify(book)); } catch (e) {} }
  function use(d) { store = d; book.cur = d.id; status = statuses[d.id] || null; sendState = 'idle'; save(); }

  // Pairing link from the QR code on the Android phone: #p=<topic>.<key>. A new topic adds a phone.
  const m = location.hash.match(/^#p=([a-z0-9]+)\.([A-Za-z0-9_-]+)$/);
  if (m) {
    let d = book.devices.find(x => x.pair && x.pair.topic === m[1]);
    if (!d) { d = { id: 'd' + Date.now().toString(36), pair: { topic: m[1], key: m[2] }, cfg: null, seenAdd: 0 }; book.devices.push(d); }
    else { d.pair.key = m[2]; keys.delete(d.id); }
    use(d);
    history.replaceState(null, '', location.pathname);
    if (d.cfg) setTimeout(() => { publish(); toast('Paired with ' + d.cfg.name + "'s phone"); }, 300);
  }

  /* ----- crypto: AES-256-GCM, same format as the Android app ----- */
  const b64u = {
    enc: b => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''),
    dec: s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
  };
  function key(d = store) {
    if (!keys.has(d.id)) keys.set(d.id, crypto.subtle.importKey('raw', b64u.dec(d.pair.key), 'AES-GCM', false, ['encrypt', 'decrypt']));
    return keys.get(d.id);
  }
  async function encrypt(text, d = store) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await key(d), new TextEncoder().encode(text));
    const out = new Uint8Array(12 + ct.byteLength); out.set(iv); out.set(new Uint8Array(ct), 12);
    return b64u.enc(out);
  }
  async function decrypt(s, d = store) {
    try {
      const all = b64u.dec(s.trim());
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: all.slice(0, 12) }, await key(d), all.slice(12));
      return new TextDecoder().decode(pt);
    } catch (e) { return null; }
  }

  /* ----- pairing again: take the phone's own copy of its settings (never start blank over them) ----- */
  const restore = new Map(); // device id -> 'busy' | 'none'
  async function fetchBackup(d) {
    try {
      const r = await fetch(NTFY + d.pair.topic + 'k/json?poll=1&since=all');
      const lines = (await r.text()).split('\n').filter(Boolean).reverse();
      for (const line of lines) {
        const o = JSON.parse(line); if (o.event !== 'message') continue;
        let body = o.message;
        if (o.attachment && o.attachment.url) { try { body = await (await fetch(o.attachment.url)).text(); } catch (e) { continue; } }
        const p = await decrypt(body, d);
        if (p) { const c = JSON.parse(p); if (c && c.ts) return c; }
      }
    } catch (e) {}
    return null;
  }
  async function tryRestore(d = store) {
    if (d.cfg || restore.get(d.id) === 'busy') return;
    restore.set(d.id, 'busy'); render();
    const c = await fetchBackup(d);
    if (c && !d.cfg) { ensure(c); d.cfg = c; restore.delete(d.id); save(); tab = 'home'; render(); toast('Found ' + c.name + "'s settings on the phone. Nothing was changed."); return; }
    restore.set(d.id, 'none'); render();
  }

  /* ----- sync ----- */
  let pubTimer = null;
  function change(fn) {
    fn(store.cfg);
    store.cfg.ts = Date.now();
    save(); sendState = 'sending'; render();
    clearTimeout(pubTimer); pubTimer = setTimeout(publish, 500);
  }
  /** Who I am on this page (shown to other family members as "changed by"). */
  const me = () => book.me || (store.cfg && store.cfg.guardian) || 'Someone in your family';

  /**
   * Two family members managing one phone: before you edit, take the newest settings anyone published
   * (another family member on <topic>c, or the phone's own copy on <topic>k), so one never wipes the other's changes.
   */
  async function pullNewest(d) {
    if (!d.pair || !d.cfg) return false;
    if (d === store && editing) return false; // never swap settings under an open form
    let best = null;
    for (const t of ['c', 'k']) {
      try {
        const r = await fetch(NTFY + d.pair.topic + t + '/json?poll=1&since=12h');
        for (const line of (await r.text()).split('\n').filter(Boolean)) {
          const o = JSON.parse(line); if (o.event !== 'message') continue;
          let body = o.message;
          if (o.attachment && o.attachment.url) { try { body = await (await fetch(o.attachment.url)).text(); } catch (e) { continue; } }
          const p = await decrypt(body, d); if (!p) continue;
          const c = JSON.parse(p); if (c && c.ts && (!best || c.ts > best.ts)) best = c;
        }
      } catch (e) {}
    }
    if (!best || best.ts <= d.cfg.ts || (d === store && editing)) return false;
    const was = d.cfg; ensure(best);
    best.grants = best.grants || was.grants; // answers already given stay answered
    d.cfg = best; save();
    if (best.by && best.by !== me()) toast((best.by) + ' changed ' + best.name + "'s phone. You now see the latest.");
    if (d === store && !editing) render();
    return true;
  }

  async function publish(d = store) {
    if (!d.pair || !d.cfg) return;
    const cur = d === store;
    if (cur) { sendState = 'sending'; render(); }
    try {
      if (!d.cfg.ts) d.cfg.ts = Date.now();
      d.cfg.by = me();
      const body = await encrypt(JSON.stringify(d.cfg), d);
      const r = await fetch(NTFY + d.pair.topic + 'c', { method: 'POST', body });
      if (cur) sendState = r.ok ? 'sent' : 'error';
    } catch (e) { if (cur) sendState = 'error'; }
    if (cur) render();
  }
  async function pollStatus(d = store) {
    if (!d.pair) return;
    try {
      const r = await fetch(NTFY + d.pair.topic + 's/json?poll=1&since=24h');
      const text = await r.text();
      const lines = text.split('\n').filter(Boolean).reverse();
      let st = null;
      for (const line of lines) {
        const o = JSON.parse(line);
        if (o.event !== 'message') continue;
        const p = await decrypt(o.message, d);
        if (p) { st = JSON.parse(p); break; }
      }
      if (!st) return;
      statuses[d.id] = st;
      if (d === store) status = st;
      if (!d.cfg) { if (st.pf && d === store && !setupTouched) { setupPick = st.pf === 'child' ? 'child' : 'senior'; render(); } return; }
      if (Array.isArray(st.add) && st.t > (d.seenAdd || 0)) {
        d.seenAdd = st.t;
        const key = x => String(x).replace(/\D/g, '').slice(-10);
        const fresh = st.add.filter(a => a && a.n && a.p && !d.cfg.contacts.some(c => key(c.p) === key(a.p)));
        if (fresh.length) {
          fresh.forEach(a => d.cfg.contacts.push({ n: a.n, r: a.r || '', p: a.p, f: 0, s: 0 }));
          d.cfg.ts = Date.now(); save(); publish(d);
          toast((d.cfg.name || 'The phone') + ' added ' + fresh.map(a => a.n).join(', '));
        } else save();
      }
      const lastCk = Array.isArray(st.ck) && st.ck.length ? st.ck[st.ck.length - 1] : null;
      if (lastCk && lastCk.t > (d.seenCk || 0)) {
        if (d.seenCk) toast(d.cfg.name + ': ' + lastCk.label);
        d.seenCk = lastCk.t; save();
      }
      if (d === store && st.a >= d.cfg.ts && sendState === 'sent') sendState = 'applied';
      if (st.mt && st.mt.id !== d.seenAsk && openAsk(d)) { d.seenAsk = st.mt.id; save(); if (d !== store) toast(d.cfg.name + ' asks for more time. Tap their phone above.'); }
      if (d === store || tab === 'home') render();
    } catch (e) {}
  }
  const pollAll = () => book.devices.forEach(d => { pollStatus(d); pullNewest(d); });
  setInterval(pollAll, 20000);
  setInterval(() => { if (store.cfg && store.cfg.req && Date.now() - store.cfg.req.ts < 180000) pollStatus(store); }, 6000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) pollAll(); });

  /* ----- UI helpers ----- */
  let toastT;
  function toast(s) { const t = document.getElementById('toast'); t.textContent = s; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }
  const sw = (on, act, val) => `<button class="sw${on ? ' on' : ''}" role="switch" aria-checked="${on}" data-a="${act}" data-v="${val || ''}"></button>`;
  function ago(t) {
    const s = Math.round((Date.now() - t) / 1000);
    if (s < 90) return 'just now';
    if (s < 3600) return Math.round(s / 60) + ' min ago';
    if (s < 86400) return Math.round(s / 3600) + ' h ago';
    return Math.round(s / 86400) + ' days ago';
  }
  const AVC = ['#5D4037', '#7B3FA0', '#1565C0', '#C2185B', '#00796B', '#B4532A'];
  const avColor = d => AVC[Math.max(0, book.devices.indexOf(d)) % AVC.length];
  function devBar() {
    return `<div class="devs">${book.devices.map(d => {
      const st = statuses[d.id], on = st && Date.now() - st.t < 15 * 60000;
      const nm = d.cfg ? d.cfg.name : 'New phone';
      return `<button class="${d === store ? 'on' : ''}" data-a="switch" data-v="${d.id}"><span class="mini" style="background:${avColor(d)}">${esc(nm[0])}<i class="${on ? 'on' : ''}"></i></span>${esc(nm)}</button>`;
    }).join('')}<button class="add" data-a="addphone">+ Add phone</button></div>`;
  }
  let phMenu = false;
  function phonesMenu() {
    return `<div class="phmenu" role="menu" aria-label="My phones"><div class="mh">My phones</div>${book.devices.map((d, i) => {
      const st = statuses[d.id], on = st && Date.now() - st.t < 15 * 60000;
      const nm = d.cfg ? d.cfg.name : 'New phone';
      const who = d.cfg ? (openAsk(d) ? '⏳ Asking for more time' : st && st.np ? 'Normal phone, KinPhone off' : d.cfg.profile === 'child' ? 'Child' : 'Senior') : 'Setup not finished';
      const bits = [who, st ? (on ? 'Online' : 'Seen ' + ago(st.t)) : 'Not seen yet', st && st.b >= 0 ? st.b + '%' : ''].filter(Boolean).join(' · ');
      return `${i ? '<div class="sep"></div>' : ''}<button role="menuitem" class="prow${d === store ? ' on' : ''}" data-a="switch" data-v="${d.id}" aria-current="${d === store}"><span class="pav" style="background:${avColor(d)}">${esc(nm[0])}<i class="${on ? 'on' : ''}"></i></span><span class="t"><b>${esc(nm)}'s phone</b><span>${bits}</span></span>${d === store ? '<span class="tick" aria-label="Selected">✓</span>' : '<span class="chev" aria-hidden="true">›</span>'}</button>`;
    }).join('')}<div class="sep"></div><button role="menuitem" class="prow add" data-a="addphone"><span class="pav plus" aria-hidden="true">+</span><span class="t"><b>Add another phone</b><span>A parent's or a child's phone</span></span></button></div>`;
  }
  function header(bar = true) {
    const c = store.cfg;
    const online = status && Date.now() - status.t < 15 * 60000;
    const seen = status ? (online ? 'Online, seen ' + ago(status.t) : 'Last seen ' + ago(status.t)) : 'Waiting for the phone to check in';
    const others = book.devices.some(d => d !== store && openAsk(d));
    return `<div class="headwrap"><div class="head"><div class="av" style="background:${avColor(store)}">${esc((c.name || 'M')[0])}</div>
      <div class="t"><b>${esc(c.name)}'s phone</b><small><span class="dot${online ? ' on' : ''}"></span>${seen} · ${status && status.np ? 'Normal phone' : isKid() ? 'Child' : 'Senior'}</small></div>
      <div class="batt">${status && status.b >= 0 ? status.b + '%' + (status.ch ? ' ⚡' : '') : ''}</div>
      <button class="more" data-a="phmenu" aria-haspopup="menu" aria-expanded="${phMenu}" aria-label="My phones: switch or add a phone">${'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>'}${others ? '<i class="pip"></i>' : ''}</button></div>
      ${phMenu ? phonesMenu() : ''}</div>`;
  }
  function sendLine() {
    if (sendState === 'sending') return `<div class="status sending">Sending...</div>`;
    if (sendState === 'sent') return `<div class="status sending">Sent. ${esc(store.cfg.name)}'s phone picks it up within 30 seconds.</div>`;
    if (sendState === 'applied') return `<div class="status done">✓ Active on ${esc(store.cfg.name)}'s phone</div>`;
    if (sendState === 'error') return `<div class="status err">Could not send. Check your internet and try again.</div>`;
    return status ? `<div class="status done">✓ Phone is in ${cap(status.m || store.cfg.mode)} mode${status.lk ? ', locked' : ''}</div>` : '';
  }

  /** Same rule as the phone: not 1234, not one digit repeated, not a run like 2345 or 9876. */
  function weakPin(p) {
    p = String(p || '');
    if (p.length < 4 || p === '1234' || new Set(p).size === 1) return true;
    const d = [...p].map(Number), up = d.every((x, i) => !i || x === d[i - 1] + 1), down = d.every((x, i) => !i || x === d[i - 1] - 1);
    return up || down;
  }
  /* ----- screens ----- */
  function setup() {
    const r = restore.get(store.id), has = status && status.cts > 0;
    if (r === 'busy' || (r === undefined)) return `<h1>Paired</h1><p class="sub"><span class="spin"></span> Looking for the settings already on this phone…</p>`;
    if (has) return `<h1>This phone already has settings</h1>
      <p class="sub">Someone in your family set it up already. To keep their contacts, reminders and PIN, get a copy from the phone:</p>
      <div class="card"><ol>
        <li>On the phone, tap the battery number 7 times and enter the family PIN.</li>
        <li>Wait 30 seconds with that screen open, then tap <b>Try again</b> below.</li>
      </ol></div>
      <button class="btn primary" data-a="restore">Try again</button>
      <button class="btn danger" data-a="fresh">Start fresh instead (replaces everything on the phone)</button>`;
    const known = status && status.pf;
    if (known) setupPick = status.pf === 'child' ? 'child' : 'senior';
    return `<h1>${known ? 'Almost done' : 'Who is this phone for?'}</h1>
      <p class="sub">${known ? `Paired with a phone set up for a <b>${setupPick === 'child' ? 'child' : 'senior'}</b>. Add the names and you're ready.` : 'Paired. Pick who will use this phone, so it starts with the right settings.'}</p>
      ${known ? '' : `<div class="pick">
        <button class="${setupPick === 'senior' ? 'on' : ''}" data-a="pick" data-v="senior"><em>👴</em><b>Senior</b><span>Big text, the phone reads things aloud, calling new numbers allowed</span></button>
        <button class="${setupPick === 'child' ? 'on' : ''}" data-a="pick" data-v="child"><em>🧒</em><b>Child</b><span>Calls only from contacts, bedtime lock, app time limits, "My location" button</span></button>
      </div>`}
      <div class="card">
        <label class="f">Their name<input id="newname" placeholder="${setupPick === 'child' ? 'Aarav' : 'Dadu'}"></label>
        <label class="f">Your name (shown on their phone)<input id="newguard" placeholder="${setupPick === 'child' ? 'Mummy' : 'Ravi'}" value="${esc(book.devices.find(d => d.cfg)?.cfg.guardian || '')}"></label>
        <label class="f">New family PIN (4 to 8 digits)<input id="newpin" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password" placeholder="Not 1234"></label>
        <div class="info">Opens the family settings on their phone. Pick one ${setupPick === 'child' ? 'your child' : 'nobody else'} can't guess, not a birthday.</div>
      </div>
      <button class="btn primary" data-a="setup">Start</button>`;
  }
  function unpaired() {
    const more = book.devices.length > 0;
    return `<h1>${more ? 'Add a phone' : 'KinPhone Control'}</h1>
      <p class="sub">Look after a simple Android phone for a parent or a child, from here.</p>
      <div class="card"><h3>Pair with the phone</h3>
        <ol>
          <li>On the Android phone, tap the battery number (top right) 7 times.</li>
          <li>Enter the family PIN (1234 the first time).</li>
          <li>Point this iPhone's Camera at the QR code and tap the link.</li>
        </ol>
      </div>${more ? '<button class="btn" data-a="canceladd">Cancel</button>' : ''}`;
  }

  /** A "more time" request from the child's phone that has no answer yet. */
  function openAsk(d = store) {
    const st = statuses[d.id], q = st && st.mt;
    if (!q || !d.cfg || (d.cfg.grants || []).some(g => g.id === q.id)) return null;
    return q;
  }
  function askCard() {
    const q = openAsk(); if (!q) return '';
    const c = store.cfg, app = (APPS[q.app] || [q.app])[0];
    const t = new Date(q.t).toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' });
    return `<div class="card ask"><h3>Request</h3>
      <div class="q"><div class="hg" aria-hidden="true">⏳</div><div><b>${esc(c.name)} asks for ${q.m} more minutes of ${esc(app)}</b><span>Today's limit is ${c.limits[q.app] || 0} min · asked at ${t}</span></div></div>
      <div class="two"><button class="btn" data-a="grant" data-v="no">Not now</button><button class="btn primary" data-a="grant" data-v="yes">Give ${q.m} min</button></div>
    </div>`;
  }
  function home() {
    const c = store.cfg, m = c.mode;
    const wa = c.modes[m].includes('whatsapp');
    return `${header()}${askCard()}
      <div class="card"><h3>Mode</h3>
        ${['basic', 'full'].map((x, i) => `${i ? '<div class="sep"></div>' : ''}<button class="opt${x === m ? ' on' : ''}" data-a="mode" data-v="${x}" role="radio" aria-checked="${x === m}"><span class="rad"></span><span class="t"><b>${cap(x)}</b><span>${modeInfo(x)}</span></span></button>`).join('')}
        <div class="sep"></div>
        <div class="info">${m === 'basic' ? 'On the phone now:' : 'Apps on the phone now:'}</div>
        <div class="chips">${c.modes[m].map(a => `<span class="chip">${APPS[a][0]}</span>`).join('')}</div>
        ${m === 'basic' ? BASIC_OK.map(a => `<div class="sep"></div><div class="row"><div class="appic" style="background:${APPS[a][1]}">${APPS[a][0][0]}</div><div class="t"><b>${APPS[a][0]} in Basic mode</b><span>${c.modes.basic.includes(a) ? 'On: shown on the home screen' : 'Off: hidden'}</span></div>${sw(c.modes.basic.includes(a), 'app', a)}</div>`).join('') : ''}
        ${m === 'full' ? `<button class="btn" data-a="tab" data-v="apps">Choose apps for Full mode</button>` : ''}
        ${sendLine()}
      </div>
      <div class="card"><h3>Safety</h3>
        ${c.mode === 'basic' ? `<div class="row"><div class="t"><b>Show Dial button</b><span>Basic mode only. Off hides the Dial button on ${esc(c.name)}'s phone</span></div>${sw(c.set.unknownDial, 'set', 'unknownDial')}</div>
        <div class="sep"></div>` : ''}
        <div class="row"><div class="t"><b>Block unknown callers</b><span>Numbers not in Contacts never ring</span></div>${sw(c.set.blockUnknown, 'set', 'blockUnknown')}</div>
        <div class="sep"></div>
        <div class="row"><div class="t"><b>Open links in SMS</b><span>Keep off to stop scam links</span></div>${sw(c.set.smsLinks, 'set', 'smsLinks')}</div>
        <div class="sep"></div>
        <div class="row"><div class="t"><b>Show SOS button</b><span>${sosLine()}</span></div>${sw(c.set.sos, 'set', 'sos')}</div>
      </div>
      <div class="card"><h3>Lock</h3>
        <div class="row"><div class="t"><b>Lock phone</b><span>${c.set.lock !== false ? 'On: top settings panel and back/home bar are hidden' : 'Off: ' + esc(c.name) + ' can open settings and use the back/home bar'}</span></div>${sw(c.set.lock !== false, 'set', 'lock')}</div>
      </div>
      <div class="card"><h3>Notifications</h3>
        <div class="row"><div class="t"><b>App pop-ups</b><span>${c.set.popups !== false ? 'On: banners from WhatsApp and other apps show' : 'Off: hidden. Calls, SMS, SOS and reminders still come through'}${c.set.popups === false && status && status.nl === false ? '. Needs one-time setup on ' + esc(c.name) + '\'s phone (family settings, Set up pop-up blocker)' : ''}</span></div>${sw(c.set.popups !== false, 'set', 'popups')}</div>
      </div>
      <div class="card"><h3>Display</h3>
        <div class="row"><div class="t"><b>Extra large text</b><span>Makes every word bigger</span></div>${sw(c.set.xl, 'set', 'xl')}</div>
      </div>
      <div class="card"><h3>${isKid() ? 'Bedtime' : 'Night lock'}</h3>
        <div class="row"><div class="t"><b>${isKid() ? 'Calls only at bedtime' : 'Basic mode at night'}</b><span>Every day, ${esc(c.night.from)} to ${esc(c.night.to)}</span></div>${sw(c.night.on, 'night')}</div>
        <div class="grid2">
          <label class="f">From<input type="time" id="nfrom" value="${esc(c.night.from)}"></label>
          <label class="f">To<input type="time" id="nto" value="${esc(c.night.to)}"></label>
        </div>
      </div>
`;
  }
  function sosLine() {
    const s = store.cfg.contacts.filter(x => x.s > 0).sort((a, b) => a.s - b.s);
    return s.length ? 'SMS with location to ' + s.map(x => esc(x.n)).join(', ') + ', then calls ' + esc(s[0].n) : 'Add SOS people in Contacts first';
  }

  function apps() {
    const c = store.cfg, m = c.mode;
    return `<h1>Apps</h1><p class="sub">${m === 'basic'
      ? `${esc(c.name)}'s phone is in <b>Basic</b> mode: Photo Dial, Contacts, Messages and Dial. You can also switch on Camera and Photos. For other apps, switch to Full on the Phone tab.`
      : `${esc(c.name)}'s phone is in <b>Full</b> mode. Choose which apps ${esc(c.name)} can open.`}</p>
      <div class="card">${ORDER.map((a, i) => {
        const [label, color, core] = APPS[a];
        const on = c.modes[m].includes(a);
        const locked = core || (m === 'basic' && !BASIC_OK.includes(a));
        return `${i ? '<div class="sep"></div>' : ''}<div class="row"><div class="appic" style="background:${color}">${label[0]}</div>
          <div class="t"><b>${label}</b><span>${core ? 'Always on' : locked ? 'Only in Full mode' : on ? 'Visible' : 'Hidden'}</span></div>
          ${locked ? '<span class="lock">Locked</span>' : sw(on, 'app', a)}</div>`;
      }).join('')}</div>
      ${isKid() ? limitsCard() : ''}
      <p class="sub" style="margin:0">Apps that are not installed on the phone are skipped.</p>
      ${sendLine()}`;
  }

  function limitsCard() {
    const c = store.cfg, used = (status && status.use) || {};
    const list = ORDER.filter(a => !APPS[a][2]);
    return `<div class="card"><h3>Daily time limits</h3>
      <div class="info">When the time is used up, the app greys out until tomorrow. Calls and messages are never limited.</div>
      ${list.map((a, i) => {
        const lim = c.limits[a] || 0, u = used[a] || 0;
        return `${i ? '<div class="sep"></div>' : ''}<div class="row"><div class="appic" style="background:${APPS[a][1]}">${APPS[a][0][0]}</div>

          <div class="step"><button data-a="lim" data-v="${a}:-1" aria-label="Less time">−</button><b>${lim ? lim + ' min' : 'No limit'}</b><button data-a="lim" data-v="${a}:1" aria-label="More time">+</button></div></div>`;
      }).join('')}</div>`;
  }

  function locate() {
    const c = store.cfg, L = status && status.loc;
    const E = status && status.le, isLoc = c.req && c.req.type === 'loc', fresh = L && isLoc && L.t >= c.req.ts;
    const failed = isLoc && !fresh && E && E.t >= c.req.ts;
    const asking = isLoc && !fresh && !failed && Date.now() - c.req.ts < 180000;
    const noAnswer = isLoc && !fresh && !failed && !asking && Date.now() - c.req.ts < 3600000;
    const at = L ? (L.ft || L.t) : 0, old = L && L.t - at > 10 * 60000;
    const ck = (status && status.ck || []).slice().reverse().slice(0, 10);
    const maps = p => `https://maps.google.com/?q=${p.lat},${p.lng}`;
    return `${header()}
      <div class="card"><h3>Where is ${esc(c.name)}</h3>
        ${L ? `<div class="loc"><div class="pin">${ic('pin')}</div><div class="t" style="flex:1"><b>${ago(at)}</b><span class="info">${WHY[L.why] || 'Shared'} · ${new Date(at).toLocaleString('en-IN', { weekday: 'short', hour: 'numeric', minute: '2-digit' })}${L.acc ? ' · within ' + Math.round(L.acc) + ' m' : ''}</span></div><a class="lnk" href="${maps(L)}" target="_blank" rel="noopener">Open in Maps</a></div>
          ${old ? `<div class="info" style="color:var(--danger)"><b>Old position.</b> The phone couldn't measure a new one, so it sent the last one it knew, from ${ago(at)}.</div>` : ''}`
          : '<div class="info">No location yet. Tap Locate now.</div>'}
        ${failed ? `<div class="info" style="color:var(--danger)"><b>Couldn't get a location.</b> ${E.why === 'perm' ? `KinPhone isn't allowed to use location on ${esc(c.name)}'s phone. Open the family settings there and tap Give KinPhone its permissions.` : `Location is switched off on ${esc(c.name)}'s phone, or it has no signal. Ask them to switch Location on.`}</div>` : ''}
        ${noAnswer ? `<div class="info" style="color:var(--danger)"><b>No answer from ${esc(c.name)}'s phone.</b> It may be switched off, out of battery or offline. Try again later.</div>` : ''}
        <button class="btn primary" data-a="locnow"${asking ? ' disabled' : ''}>${asking ? `<span class="spin"></span> Asking ${esc(c.name)}'s phone…` : 'Locate now'}</button>
        <div class="info">${esc(c.name)}'s phone answers within about a minute and shows a note that it shared its location.</div>
      </div>
      <div class="card"><h3>Share location automatically</h3>
        <div class="info">Every day at these times, ${esc(c.name)}'s phone sends you where it is.</div>
        <div class="tchips">${c.loc.times.length ? c.loc.times.map((t, i) => `<span>${t12(t).replace(/<\/?small>/g, ' ')}<button data-a="locdel" data-v="${i}" aria-label="Remove">✕</button></span>`).join('') : '<span style="padding:6px 12px">No times yet</span>'}</div>
        <div class="grid2"><label class="f">Add a time<input type="time" id="locadd" value="15:00"></label><button class="btn" data-a="locadd" style="align-self:end">Add</button></div>
      </div>
      <div class="card"><h3>Sent by ${esc(c.name)}</h3>
        ${ck.length ? ck.map((e, i) => `${i ? '<div class="sep"></div>' : ''}<div class="row"><div class="t"><b>${esc(e.label)}</b><span>${new Date(e.t).toLocaleString('en-IN', { weekday: 'short', hour: 'numeric', minute: '2-digit' })}</span></div>${e.lat ? `<a class="lnk" href="${maps(e)}" target="_blank" rel="noopener">Map</a>` : ''}</div>`).join('')
          : `<div class="info">When ${esc(c.name)} taps <b>My location</b> on the phone, it shows up here. For an alert on your phone, subscribe to the alert topic in Settings.</div>`}
      </div>`;
  }

          <div class="t" data-a="edit" data-v="${i}"><b>${esc(p.n)}${p.s ? `<span class="badge">SOS ${p.s}</span>` : ''}</b><span>${p.r ? esc(p.r) + ' · ' : ''}${esc(p.p)}</span></div>

        <div class="grid2"><label class="btn" style="cursor:pointer">${(editing.photo ?? photoOf(p.p)) ? 'Change photo' : 'Add photo'}<input type="file" id="cph" accept="image/*" hidden></label>
          ${(editing.photo ?? photoOf(p.p)) ? '<button class="btn danger" data-a="rmph">Remove photo</button>' : ''}</div>

  /* ----- choose from the contacts already saved on their phone ----- */
  // Kept in memory only (never saved on this page): device id -> { st: 'asking'|'ready'|'fail', list: [[name, number]], q, open }
  const books = new Map();
  function bookPicker() {
    const c = store.cfg, b = books.get(store.id);
    if (!b) return `<button class="btn" data-a="book">${ic('user')} Choose from ${esc(c.name)}'s phone</button>`;
    if (b.st === 'asking') return `<div class="info"><span class="spin"></span> Asking ${esc(c.name)}'s phone for its contacts…</div>`;
    if (b.st === 'fail') return `<div class="info" style="color:var(--danger)">${esc(c.name)}'s phone didn't answer. It may be off or offline.</div><button class="btn" data-a="book">Try again</button>`;
    if (!b.open) return `<button class="btn" data-a="bookopen">${ic('user')} Choose from ${esc(c.name)}'s phone (${b.list.length})</button>`;
    const q = (b.q || '').toLowerCase(), qd = q.replace(/\D/g, '');
    const have = new Set(c.contacts.map(x => pkey(x.p)));
    const rows = b.list.map((x, i) => [x, i]).filter(([x]) => !q || x[0].toLowerCase().includes(q) || (qd && x[1].replace(/\D/g, '').includes(qd))).slice(0, 60);
    return `<div class="book">
      <input id="bq" type="search" placeholder="Search ${b.list.length} contacts" value="${esc(b.q || '')}" autocomplete="off">
      <div class="blist">${rows.length ? rows.map(([x, i]) => `<button class="brow" data-a="pickbook" data-v="${i}"${have.has(pkey(x[1])) ? ' disabled' : ''}><b>${esc(x[0])}</b><span>${esc(x[1])}${have.has(pkey(x[1])) ? ' · already added' : ''}</span></button>`).join('') : '<div class="info" style="padding:10px 0">No match.</div>'}</div>
      <button class="btn" data-a="bookclose">Type it myself instead</button>
    </div>`;
  }
  async function fetchBook(d, since) {
    try {
      const r = await fetch(NTFY + d.pair.topic + 'b/json?poll=1&since=' + Math.floor(since / 1000));
      const lines = (await r.text()).split('\n').filter(Boolean).reverse();
      for (const line of lines) {
        const o = JSON.parse(line); if (o.event !== 'message') continue;
        let body = o.message;
        if (o.attachment && o.attachment.url) { try { body = await (await fetch(o.attachment.url)).text(); } catch (e) { continue; } }
        const p = await decrypt(body, d); if (!p) continue;
        const j = JSON.parse(p); if (j.t >= since - 5000 && Array.isArray(j.list)) return j.list;
      }
    } catch (e) {}
    return null;
  }
  function askBook() {
    const d = store, since = Date.now();
    keepForm();
    books.set(d.id, { st: 'asking' }); render();
    change(c => c.req = { id: 'b' + since.toString(36), type: 'book', ts: since });
    let n = 0;
    const tick = async () => {
      const list = await fetchBook(d, since);
      if (list) { books.set(d.id, { st: 'ready', list, open: true }); if (d === store) render(); return; }
      if (++n >= 25) { books.set(d.id, { st: 'fail' }); if (d === store) render(); return; }
      setTimeout(tick, 4000);
    };
    setTimeout(tick, 3000);
  }
  /** Keep what was typed in the contact form before the screen redraws. */
  function keepForm() {
    if (!editing || !editing.p) return;
    ['cn', 'cr', 'cp'].forEach(id => { const el = document.getElementById(id); if (el) editing.p[{ cn: 'n', cr: 'r', cp: 'p' }[id]] = el.value; });
  }

  /* ----- reminders ----- */
  const DAYN = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  function t12(at) { const [h, m] = at.split(':').map(Number); return `${h % 12 || 12}:${String(m).padStart(2, '0')}<small>${h < 12 ? 'AM' : 'PM'}</small>`; }
  function repeatText(r) {
    if (r.dt) { const d = new Date(r.dt + 'T00:00'); return 'Once, ' + d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }); }
    if (!r.d.length || r.d.length === 7) return 'Every day';
    if (r.d.join() === '1,2,3,4,5') return 'Weekdays';
    if (r.d.join() === '6,7') return 'Weekends';
    return r.d.map(n => DAYN[n - 1]).join(', ');
  }
  const sameDay = (a, b) => new Date(a).toDateString() === new Date(b).toDateString();
  function todayState(r) {
    const e = (status && status.rl || []).find(x => x.i === r.i && sameDay(x.at, Date.now()));
    if (!e) return '';
    const w = new Date(e.w).toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' });
    return e.s === 'done' ? `<span class="rstate done">✓ Done today at ${w}</span>` : e.s === 'missed' ? `<span class="rstate missed">Missed today</span>` : `<span class="rstate snoozed">Snoozed at ${w}</span>`;
  }
  function reminders() {
    const c = store.cfg;
    if (editing && editing.kind === 'rem') return reminderForm();
    const list = [...c.rem].sort((a, b) => a.at.localeCompare(b.at));
    const log = (status && status.rl || []).slice(0, 8);
    return `<h1>Reminders</h1><p class="sub">${esc(c.name)}'s phone rings, shows the message in big text and reads it aloud. ${esc(c.name)} taps Done or Remind me in 10 min.</p>
      <div class="card">${list.length ? list.map((r, i) => `${i ? '<div class="sep"></div>' : ''}<div class="row">
          <div class="rtime" data-a="redit" data-v="${r.i}">${t12(r.at)}</div>
          <div class="t" data-a="redit" data-v="${r.i}"><b>${esc(r.t)}</b><span>${repeatText(r)}${r.on ? '' : ' · Paused'}</span>${todayState(r)}</div>
          ${sw(r.on, 'ron', r.i)}</div>`).join('')
        : `<div class="info">No reminders yet. Add ${isKid() ? 'homework, tuition, drinking water' : 'medicines, meals, a walk'}, or anything else.</div>`}</div>
      <button class="btn primary" data-a="radd">Add reminder</button>
      ${log.length ? `<div class="card"><h3>Recent</h3>${log.map((e, i) => `${i ? '<div class="sep"></div>' : ''}<div class="row"><div class="t"><b>${esc(e.t)}</b><span>${new Date(e.at).toLocaleString('en-IN', { weekday: 'short', hour: 'numeric', minute: '2-digit' })}</span></div><span class="rstate ${e.s}">${e.s === 'done' ? '✓ Done' : e.s === 'missed' ? 'Missed' : 'Snoozed'}</span></div>`).join('')}</div>` : ''}
      ${sendLine()}`;
  }
  function reminderForm() {
    const r = editing.r, isNew = editing.i < 0;
    const mode = r.dt ? 'once' : !r.d.length || r.d.length === 7 ? 'daily' : 'days';
    return `<h1>${isNew ? 'Add reminder' : 'Edit reminder'}</h1>
      <div class="card">
        <label class="f">Message<input id="rt" value="${esc(r.t)}" placeholder="${isKid() ? 'Finish your homework' : 'Take your BP tablet'}" maxlength="80"></label>
        <label class="f">Time<input id="rtime" type="time" value="${esc(r.at)}"></label>
        <div class="f" style="display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)">Repeat
          <div class="seg">${[['daily', 'Every day'], ['days', 'Some days'], ['once', 'Once']].map(([k, l]) => `<button class="${mode === k ? 'on' : ''}" data-a="rmode" data-v="${k}">${l}</button>`).join('')}</div></div>
        ${mode === 'days' ? `<div class="days">${DAYN.map((d, i) => `<button class="${r.d.includes(i + 1) ? 'on' : ''}" data-a="rday" data-v="${i + 1}">${d[0]}${d[1]}</button>`).join('')}</div>` : ''}
        ${mode === 'once' ? `<label class="f">Date<input id="rdate" type="date" value="${esc(r.dt)}"></label>` : ''}
      </div>
      <button class="btn primary" data-a="rsave">Save</button>
      <button class="btn" data-a="cancelc">Cancel</button>
      ${isNew ? '' : '<button class="btn danger" data-a="rdel">Delete reminder</button>'}`;
  }
  function keepRem() {
    if (!editing || editing.kind !== 'rem') return;
    const g = id => { const el = document.getElementById(id); return el ? el.value : null; };
    if (g('rt') !== null) editing.r.t = g('rt');
    if (g('rtime') !== null) editing.r.at = g('rtime');
    if (g('rdate') !== null) editing.r.dt = g('rdate');

  const todayIso = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

  function settings() {

    return `<h1>Settings</h1>
      <div class="card"><h3>Names</h3>
        <label class="f">Their name<input id="sname" value="${esc(c.name)}"></label>

  function render() {
    const app = document.getElementById('app');
    const tabs = document.getElementById('tabs');
    const active = document.activeElement && document.activeElement.id;
    if (active && ['bq', 'cn', 'cr', 'cp', 'sname', 'sguard', 'spin', 'newpin', 'rt', 'rtime', 'rdate', 'newname', 'newguard', 'ck0', 'ck1', 'ck2', 'locadd'].includes(active)) return; // don't wipe typing
    const sh = () => app.querySelectorAll('.card > h3:first-child').forEach(h => { h.classList.add('sh'); h.parentElement.before(h); });
    if (!book.devices.length || adding) { app.innerHTML = unpaired(); sh(); tabs.hidden = true; return; }
    if (!store.cfg) { if (!restore.has(store.id)) setTimeout(() => tryRestore(store), 0); app.innerHTML = setup(); sh(); tabs.hidden = true; return; }
    if (tab === 'loc' && !isKid()) tab = 'home';
    app.innerHTML = tab === 'home' ? home() : tab === 'apps' ? apps() : tab === 'loc' ? locate() : tab === 'contacts' ? contacts() : tab === 'rem' ? reminders() : settings();
    sh();
    tabs.hidden = false;
    tabs.innerHTML = [['home', 'gauge', 'Phone'], ['apps', 'apps', 'Apps'], ...(isKid() ? [['loc', 'pin', 'Location']] : []), ['contacts', 'user', 'Contacts'], ['rem', 'bell', 'Reminders'], ['settings', 'gear', 'Settings']]
      .map(([k, i, l]) => `<button class="${tab === k ? 'on' : ''}" data-a="tab" data-v="${k}">${ic(i)}${l}</button>`).join('');
  }

  document.addEventListener('click', e => {
    if (phMenu && !e.target.closest('.phmenu, [data-a="phmenu"]')) { phMenu = false; render(); return; }
    const b = e.target.closest('[data-a]'); if (!b) return;
    const a = b.dataset.a, v = b.dataset.v;
    const c = store.cfg;
    switch (a) {
      case 'tab': tab = v; editing = null; appsMode = null; render(); window.scrollTo(0, 0); if (v === 'loc' || v === 'apps') pollStatus(); break;
      case 'phmenu': phMenu = !phMenu; render(); break;
      case 'switch': { phMenu = false; if (v === store.id) { render(); break; } const d = book.devices.find(x => x.id === v); if (d && d !== store) { use(d); tab = 'home'; editing = null; appsMode = null; render(); pollStatus(d); window.scrollTo(0, 0); } break; }
      case 'addphone': phMenu = false; adding = true; render(); window.scrollTo(0, 0); break;
      case 'canceladd': adding = false; render(); break;
      case 'pick': setupPick = v; setupTouched = true; { const n = val('newname'), g = val('newguard'); render(); document.getElementById('newname').value = n; document.getElementById('newguard').value = g; } break;
      case 'restore': restore.delete(store.id); tryRestore(store); break;
      case 'fresh': if (!b.dataset.sure) { b.dataset.sure = '1'; b.textContent = 'Tap again: erase their contacts, reminders and PIN'; break; }
        status = Object.assign({}, status, { cts: 0 }); statuses[store.id] = status; render(); break;
      case 'setup': {
        const n = val('newname'), g = val('newguard');
        if (!n) { toast('Type their name.'); break; }
        const np = val('newpin').replace(/\D/g, '');
        if (weakPin(np)) { toast(np.length < 4 ? 'Choose a family PIN of 4 to 8 digits.' : 'That PIN is easy to guess. Try another.'); break; }
        store.cfg = defaults(setupPick); store.cfg.name = n; store.cfg.guardian = g || 'family'; store.cfg.pin = np; store.cfg.ts = Date.now();
        if (g) book.me = g;
        save(); tab = 'home'; render(); publish(); toast('Paired with ' + n + "'s phone");
        break;
      }
      case 'profile': if (v !== c.profile) { change(c => { c.profile = v; ensure(c); }); toast(v === 'child' ? 'Child profile on. Check Safety and time limits.' : 'Senior profile on.'); } break;
      case 'lim': {
        const [app, dir] = v.split(':'); const cur = c.limits[app] || 0;
        const i = LIMIT_STEPS.indexOf(LIMIT_STEPS.reduce((b, x) => Math.abs(x - cur) < Math.abs(b - cur) ? x : b, 0));
        const nx = LIMIT_STEPS[Math.max(0, Math.min(LIMIT_STEPS.length - 1, i + (+dir)))];
        change(c => { if (nx) c.limits[app] = nx; else delete c.limits[app]; });
        break;
      }
      case 'grant': { const q = openAsk(); if (!q) break; const ok = v === 'yes';
        change(c => { c.grants = [...(c.grants || []).slice(-9), { id: q.id, app: q.app, m: q.m, ok, t: Date.now() }]; });
        toast(ok ? `Given. ${c.name}'s phone gets ${q.m} more minutes within 30 seconds.` : `Sent "not now" to ${c.name}'s phone.`); break; }
      case 'normal': if (b.dataset.sure) { change(c => c.req = { id: 'n' + Date.now().toString(36), type: 'normal', ts: Date.now() }); toast(c.name + "'s phone switches within 30 seconds."); }
        else { b.dataset.sure = '1'; b.textContent = 'Tap again to switch ' + c.name + "'s phone to normal"; b.classList.add('danger'); } break;
      case 'locnow': change(c => c.req = { id: 'q' + Date.now().toString(36), type: 'loc', ts: Date.now() }); break;
      case 'locdel': change(c => c.loc.times.splice(+v, 1)); break;
      case 'locadd': {
        const t = (document.getElementById('locadd').value || '').slice(0, 5);
        if (!/^\d{2}:\d{2}$/.test(t)) { toast('Pick a time.'); break; }
        if (c.loc.times.includes(t)) { toast('That time is already set.'); break; }
        if (c.loc.times.length >= 8) { toast('Up to 8 times a day.'); break; }
        document.activeElement && document.activeElement.blur();
        change(c => { c.loc.times.push(t); c.loc.times.sort(); });
        break;
      }
      case 'mode': if (v !== c.mode) change(c => c.mode = v); break;
      case 'wa': change(c => toggleApp(c, v, 'whatsapp')); break;
      case 'set': change(c => c.set[v] = (v === 'lock' || v === 'popups') ? c.set[v] === false : !c.set[v]); break;
      case 'night': change(c => c.night.on = !c.night.on); break;
      case 'appsmode': appsMode = v; render(); break;
      case 'app': change(c => toggleApp(c, c.mode, v)); break;
      case 'fav': {
        const p = c.contacts[+v];
        if (!p.f && c.contacts.filter(x => x.f).length >= 4) { toast('The home screen holds 4 people. Remove a star first.'); break; }
        change(c => c.contacts[+v].f = p.f ? 0 : 1); break;
      }
      case 'add': editing = { i: -1, p: { n: '', r: '', p: '', f: 0, s: 0 } }; render(); break;
      case 'edit': editing = { i: +v, p: { ...c.contacts[+v] } }; render(); break;
      case 'cancelc': editing = null; render(); break;
      case 'book': askBook(); break;
      case 'bookopen': keepForm(); books.get(store.id).open = true; render(); break;
      case 'bookclose': keepForm(); books.get(store.id).open = false; render(); break;
      case 'pickbook': { keepForm(); const bk = books.get(store.id), x = bk.list[+v]; editing.p.n = x[0]; editing.p.p = x[1]; bk.open = false; render(); toast(x[0] + ' picked. Add a photo or description, then Save.'); break; }
      case 'savec': {
        const phNew = editing.photo;
        const p = { n: val('cn'), r: val('cr'), p: val('cp'), f: editing.p.f || 0, s: +document.getElementById('cs').value };
        if (!p.n || p.p.replace(/\D/g, '').length < 6) { toast('Add a name and a full phone number.'); break; }
        const i = editing.i; editing = null;
        document.activeElement && document.activeElement.blur();
        change(c => {
          if (p.s) c.contacts.forEach((x, j) => { if (x.s === p.s && j !== i) x.s = 0; });
          if (i < 0) c.contacts.push(p); else c.contacts[i] = p;
        });
        if (phNew !== undefined) setPhoto(p.p, phNew);
        break;
      }
      case 'delc': { const i = editing.i; editing = null; change(c => c.contacts.splice(i, 1)); break; }
      case 'radd': editing = { kind: 'rem', i: -1, r: { i: 'r' + Date.now().toString(36), t: '', at: '09:00', d: [], dt: '', on: true } }; render(); break;
      case 'redit': { const i = c.rem.findIndex(x => x.i === v); editing = { kind: 'rem', i, r: { ...c.rem[i], d: [...c.rem[i].d] } }; render(); break; }
      case 'ron': change(c => { const r = c.rem.find(x => x.i === v); if (r) r.on = !r.on; }); break;
      case 'rmode': keepRem(); { const r = editing.r;
        if (v === 'daily') { r.d = []; r.dt = ''; }
        if (v === 'days') { r.dt = ''; if (!r.d.length || r.d.length === 7) r.d = [1, 2, 3, 4, 5]; }
        if (v === 'once') { r.d = []; r.dt = r.dt || todayIso(); } }
        render(); break;
      case 'rday': { keepRem(); const n = +v, d = editing.r.d; const k = d.indexOf(n); if (k >= 0) d.splice(k, 1); else { d.push(n); d.sort(); } render(); break; }
      case 'rsave': {
        keepRem(); const r = editing.r; r.t = r.t.trim();
        if (!r.t) { toast('Type the reminder message.'); break; }
        if (!/^\d{2}:\d{2}$/.test(r.at)) { toast('Pick a time.'); break; }
        if (r.dt === '' && editing.r.d.length === 0 && document.querySelector('.days')) { toast('Pick at least one day.'); break; }
        const i = editing.i; editing = null;
        document.activeElement && document.activeElement.blur();
        change(c => { if (i < 0) c.rem.push(r); else c.rem[i] = r; });
        toast('Saved. ' + c.name + "'s phone gets it within 30 seconds.");
        break;
      }
      case 'rdel': { const i = editing.i; editing = null; change(c => c.rem.splice(i, 1)); break; }
      case 'copysos': copy(store.pair.topic + 'a'); break;
      case 'resend': store.cfg.ts = Date.now(); save(); publish(); Object.keys(store.photos || {}).forEach(k => sendPhoto(store, k, store.photos[k])); toast('Sent'); break;
      case 'rmph': editing.photo = ''; render(); break;
      case 'unpair': if (b.dataset.sure) {
          keys.delete(store.id); delete statuses[store.id];
          book.devices = book.devices.filter(d => d !== store);
          if (book.devices.length) use(book.devices[0]); else { store = { id: null, pair: null, cfg: null }; book.cur = null; status = null; save(); }
          tab = 'home'; render();
        } else { b.dataset.sure = '1'; b.textContent = 'Tap again to remove'; } break;
    }
  });
  /* ----- contact photos: shrunk to 96 px, kept on this page, sent to the phone on <topic>p ----- */
  const pkey = num => String(num || '').replace(/\D/g, '').slice(-10);
  const photoOf = num => (store.photos || {})[pkey(num)] || '';
  function faceHtml(p, size, col, override) {
    const ph = override !== undefined ? override : photoOf(p.p);
    return ph ? `<img src="${ph}" alt="" style="width:${size}px;height:${size}px;border-radius:50%;object-fit:cover;flex:none">`
      : `<div class="av" style="width:${size}px;height:${size}px;font-size:${Math.round(size * .42)}px;background:${col}">${esc((p.n || '?')[0])}</div>`;
  }
  function shrink(file) {
    return new Promise((res, rej) => {
      const img = new Image(); img.onerror = rej;
      img.onload = () => {
        const S = 96, cv = document.createElement('canvas'); cv.width = cv.height = S;
        const m = Math.min(img.width, img.height);
        cv.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, S, S);
        let q = .75, out = cv.toDataURL('image/jpeg', q);
        while (out.length > 2700 && q > .2) { q -= .08; out = cv.toDataURL('image/jpeg', q); }
        URL.revokeObjectURL(img.src); res(out);
      };
      img.src = URL.createObjectURL(file);
    });
  }
  async function sendPhoto(d, key, data) {
    if (!d.pair) return;
    try { await fetch(NTFY + d.pair.topic + 'p', { method: 'POST', body: await encrypt(JSON.stringify({ k: key, d: data || '', t: Date.now() }), d) }); } catch (e) {}
  }
  function setPhoto(num, data) {
    const k = pkey(num); if (k.length < 6) return;
    store.photos = store.photos || {};
    if (data) store.photos[k] = data; else delete store.photos[k];
    save(); sendPhoto(store, k, data);
  }

  document.addEventListener('change', async e => {
    if (e.target.id === 'cph' && e.target.files[0] && editing) {
      try { editing.p.n = val('cn') || editing.p.n; editing.p.r = val('cr'); editing.p.p = val('cp') || editing.p.p; editing.photo = await shrink(e.target.files[0]); document.activeElement && document.activeElement.blur(); render(); }
      catch (_) { toast('Could not read that photo'); }
      return;
    }
    const id = e.target.id;
    if (id === 'nfrom' || id === 'nto') change(c => c.night[id === 'nfrom' ? 'from' : 'to'] = e.target.value);
    if (id === 'sname') change(c => c.name = e.target.value.trim() || c.name);
    if (/^ck[0-2]$/.test(id)) change(c => { const a = [0, 1, 2].map(i => (document.getElementById('ck' + i) || {}).value || c.checkin[i] || '').map(s => s.trim()); c.checkin = a.filter(Boolean); if (!c.checkin.length) c.checkin = ['Reached school']; });
    if (id === 'sguard') change(c => c.guardian = e.target.value.trim() || 'family');
    if (id === 'spin') {
      const p = e.target.value.replace(/\D/g, '');
      if (p.length < 4) { toast('PIN needs 4 to 8 digits'); e.target.value = c.pin; return; }
      if (weakPin(p)) { toast('That PIN is easy to guess. Try another.'); e.target.value = c.pin; return; }
      change(c => c.pin = p); toast('PIN changed');
    }
  });
  document.addEventListener('input', e => {
    if (e.target.id !== 'bq') return;
    const b = books.get(store.id); if (!b) return;
    b.q = e.target.value;
    const tmp = document.createElement('div'); tmp.innerHTML = bookPicker();
    const fresh = tmp.querySelector('.blist'), old = document.querySelector('.book .blist');
    if (fresh && old) old.replaceWith(fresh);
  });
  function val(id) { return (document.getElementById(id).value || '').trim(); }
  /** Apps that can also be switched on in Basic mode (simple, can't lead anywhere risky). */
  const BASIC_OK = ['camera', 'photos'];
  function toggleApp(c, mode, app) {
    if (APPS[app][2] || (mode === 'basic' && !BASIC_OK.includes(app))) return;
    const list = c.modes[mode];
    const i = list.indexOf(app);
    if (i >= 0) list.splice(i, 1); else { list.push(app); list.sort((x, y) => ORDER.indexOf(x) - ORDER.indexOf(y)); }
  }
  function copy(s) {
    navigator.clipboard.writeText(s).then(() => toast('Copied'), () => {
      const r = document.createRange(); r.selectNodeContents(document.getElementById('sostopic'));
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('Selected. Tap Copy.');
    });
  }

  render();
  pollAll();
})();
</script>
